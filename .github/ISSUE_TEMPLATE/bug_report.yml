name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where?
      options:
        - The script (in Apps Script / Telegram)
        - The website
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Script version
      description: The `VERSION` line at the top of your script, e.g. 1.1.1
  - type: textarea
    id: logs
    attributes:
      label: Error message or log
      description: From Apps Script (Executions) or the browser. Remove your bot token and chat ID first.
      render: text
