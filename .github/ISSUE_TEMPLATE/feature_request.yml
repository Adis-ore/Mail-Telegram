name: Feature idea
description: Suggest something new
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like it to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
  - type: checkboxes
    id: help
    attributes:
      label: Can you help build it?
      options:
        - label: Yes, I'd like to open a pull request for this
