name: Check

# Runs on every pull request (and on main): the site must build, the script must be valid
# JavaScript, version.json must be valid, and no real bot token may be committed.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build the website
        run: |
          npm ci
          npm run build

      - name: Script is valid JavaScript
        run: |
          cp script/Code.gs "$RUNNER_TEMP/Code.js"
          node --check "$RUNNER_TEMP/Code.js"

      - name: version.json is valid
        run: node -e "const v=require('./script/version.json'); if(!/^\d+\.\d+\.\d+$/.test(v.version)) throw new Error('version.json needs a version like 1.2.3')"

      - name: No real bot tokens or personal details in the script
        run: |
          if grep -nE '[0-9]{8,10}:[A-Za-z0-9_-]{35}' script/Code.gs; then
            echo "::error::A real-looking Telegram bot token is in script/Code.gs. Use the placeholder."; exit 1
          fi
          grep -q 'BOT_TOKEN: "PASTE_YOUR_BOT_TOKEN_HERE"' script/Code.gs || { echo "::error::BOT_TOKEN must stay as the placeholder."; exit 1; }
          grep -q 'CHAT_ID: "PASTE_YOUR_CHAT_ID_HERE"' script/Code.gs || { echo "::error::CHAT_ID must stay as the placeholder."; exit 1; }
