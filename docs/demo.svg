<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-label="Animated demo: an email arrives in Telegram with its code in bold, a summarize reply, a meeting reminder and an update alert">
  <style>
    :root { --bg:#e9edf3; --head:#ffffff; --in:#ffffff; --out:#dcf5c6; --ink:#14161f; --mute:#6b7389; --acc:#2f6bff; --code:#eef2ff; --line:#d5dae6; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0e1621; --head:#17212b; --in:#182533; --out:#2b5278; --ink:#f2f3fa; --mute:#8fa1b5; --acc:#6ab2f2; --code:#22344a; --line:#22303e; }
    }
    text { font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill:var(--ink); }
    .b { font-weight:700; } .m { fill:var(--mute); } .a { fill:var(--acc); } .s { font-size:13px; } .x { font-size:15px; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-weight:700; }
    .in { fill:var(--in); } .out { fill:var(--out); } .code { fill:var(--code); }
    .msg { opacity:0; transform-box:fill-box; transform-origin:0 100%; }
    /* 14s loop: messages arrive one by one, hold, then everything clears */
    .m1 { animation:m1 14s infinite; } .m2 { animation:m2 14s infinite; } .m3 { animation:m3 14s infinite; }
    .m4 { animation:m4 14s infinite; } .m5 { animation:m5 14s infinite; }
    @keyframes m1 { 0%,3% { opacity:0; transform:translateY(16px) scale(.97); } 7%,92% { opacity:1; transform:none; } 97%,100% { opacity:0; } }
    @keyframes m2 { 0%,20% { opacity:0; transform:translateY(16px) scale(.97); } 24%,92% { opacity:1; transform:none; } 97%,100% { opacity:0; } }
    @keyframes m3 { 0%,32% { opacity:0; transform:translateY(16px) scale(.97); } 36%,92% { opacity:1; transform:none; } 97%,100% { opacity:0; } }
    @keyframes m4 { 0%,50% { opacity:0; transform:translateY(16px) scale(.97); } 54%,92% { opacity:1; transform:none; } 97%,100% { opacity:0; } }
    @keyframes m5 { 0%,66% { opacity:0; transform:translateY(16px) scale(.97); } 70%,92% { opacity:1; transform:none; } 97%,100% { opacity:0; } }
    .typing circle { fill:var(--mute); animation:blink 1s infinite; } .typing circle:nth-child(2) { animation-delay:.15s; } .typing circle:nth-child(3) { animation-delay:.3s; }
    .typing { opacity:0; animation:typing 14s infinite; }
    @keyframes typing { 0%,26% { opacity:0; } 27%,32% { opacity:1; } 33%,100% { opacity:0; } }
    @keyframes blink { 50% { opacity:.25; } }
    @media (prefers-reduced-motion: reduce) { .msg { animation:none; opacity:1; } .typing { display:none; } }
  </style>

  <rect width="760" height="560" rx="24" fill="var(--bg)"/>
  <!-- chat header -->
  <rect width="760" height="64" rx="24" fill="var(--head)"/><rect y="40" width="760" height="24" fill="var(--head)"/>
  <circle cx="44" cy="32" r="18" fill="#2f6bff"/>
  <path d="M35 28h18v12H35z M35 28l9 7 9-7" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
  <text x="74" y="29" class="b x">Mail to Telegram</text>
  <text x="74" y="47" class="s m">bot</text>
  <line x1="0" y1="64" x2="760" y2="64" stroke="var(--line)"/>

  <!-- 1. forwarded email with OTP -->
  <g class="msg m1">
    <rect x="24" y="84" width="470" height="132" rx="16" class="in"/>
    <text x="42" y="112" class="b x">Your verification code</text>
    <text x="42" y="134" class="s m">Acme &lt;no-reply@acme.com&gt;</text>
    <text x="42" y="154" class="s b">Thu, 19 Nov 2026, 9:41 AM</text>
    <text x="42" y="178" class="s">OTP:</text>
    <rect x="76" y="163" width="74" height="22" rx="6" class="code"/><text x="84" y="179" class="s mono">482913</text>
    <text x="160" y="178" class="s m">tap to copy</text>
    <text x="42" y="202" class="s m">No-reply sender</text>
  </g>

  <!-- 2. user swipe-replies "summarize" -->
  <g class="msg m2">
    <rect x="530" y="232" width="206" height="54" rx="16" class="out"/>
    <rect x="544" y="242" width="3" height="18" rx="1.5" fill="var(--acc)"/>
    <text x="554" y="255" class="s a">Your verification code</text>
    <text x="554" y="276" class="x">summarize</text>
  </g>

  <g class="typing" transform="translate(44 318)"><circle cx="0" cy="0" r="4"/><circle cx="14" cy="0" r="4"/><circle cx="28" cy="0" r="4"/></g>

  <!-- 3. summary -->
  <g class="msg m3">
    <rect x="24" y="300" width="470" height="78" rx="16" class="in"/>
    <text x="42" y="326" class="b x">Summary</text>
    <text x="42" y="348" class="s">- Acme sign-in code <tspan class="mono">482913</tspan>, expires in 10 minutes.</text>
    <text x="42" y="366" class="s">- Ignore it if you didn’t try to sign in.</text>
  </g>

  <!-- 4. reminder -->
  <g class="msg m4">
    <rect x="24" y="394" width="470" height="58" rx="16" class="in"/>
    <text x="42" y="419" class="x"><tspan class="b">Reminder:</tspan> Interview with Acme</text>
    <text x="42" y="439" class="s">Starts in 10 min, <tspan class="b">Thu, 19 Nov, 3:00 PM</tspan></text>
  </g>

  <!-- 5. update alert with buttons -->
  <g class="msg m5">
    <rect x="24" y="468" width="470" height="44" rx="16" class="in"/>
    <text x="42" y="495" class="x"><tspan class="b">Update available:</tspan> v1.1.0 is out</text>
    <rect x="24" y="518" width="233" height="30" rx="10" class="in" opacity=".85"/><text x="140" y="538" class="s a" text-anchor="middle">Open the new script</text>
    <rect x="261" y="518" width="233" height="30" rx="10" class="in" opacity=".85"/><text x="377" y="538" class="s a" text-anchor="middle">Remind me tomorrow</text>
  </g>
</svg>
