<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Mail to Telegram</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b7bff"/><stop offset="1" stop-color="#2452d6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <!-- envelope -->
  <rect x="10" y="24" width="32" height="24" rx="5" fill="none" stroke="#fff" stroke-width="3.4"/>
  <path d="M12 27.5 26 37.5 40 27.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- paper plane leaving the envelope, knocked out with the tile colour so it reads on top -->
  <path d="M29 23 55 10 47 40 40.5 31Z" fill="#fff" stroke="#2c62ea" stroke-width="3" stroke-linejoin="round"/>
  <path d="M55 10 40.5 31" fill="none" stroke="#2c62ea" stroke-width="2.2" stroke-linecap="round"/>
</svg>
