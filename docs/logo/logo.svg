<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Mail to Telegram</title>
  <defs>
    <linearGradient id="mt-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#40bcf5"/><stop offset="1" stop-color="#1679c9"/>
    </linearGradient>
    <linearGradient id="mt-hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Telegram-blue tile -->
  <rect width="64" height="64" rx="16" fill="url(#mt-bg)"/>
  <rect width="64" height="64" rx="16" fill="url(#mt-hi)"/>
  <!-- chat bubble -->
  <path d="M20 13H44A8 8 0 0 1 52 21V35A8 8 0 0 1 44 43H28L17.5 51 20 43A8 8 0 0 1 12 35V21A8 8 0 0 1 20 13Z" fill="#fff"/>
  <!-- envelope inside the bubble -->
  <rect x="21" y="20" width="22" height="16" rx="3.2" fill="none" stroke="#1a86d4" stroke-width="2.8"/>
  <path d="M22.6 22.4 32 29 41.4 22.4" fill="none" stroke="#1a86d4" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- new-mail dot -->
  <circle cx="49.5" cy="14.5" r="6.2" fill="#ea4335" stroke="#fff" stroke-width="2.6"/>
</svg>
